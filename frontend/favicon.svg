<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="omimind-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="shine-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#omimind-grad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
  
  <!-- Subtle Top Highlight / Gloss -->
  <path d="M 4 18 C 4 8 8 4 18 4 L 46 4 C 56 4 60 8 60 18 C 60 14 54 10 44 10 L 20 10 C 10 10 4 14 4 18 Z" fill="url(#shine-grad)" />

  <!-- Ambient Voice Waves (Left) -->
  <path d="M 18 25 C 16.5 27.5 16.5 31.5 18 34" fill="none" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
  <path d="M 13 21 C 10.5 25.5 10.5 33.5 13 38" fill="none" stroke="#bae6fd" stroke-width="2.2" stroke-linecap="round" opacity="0.6" />

  <!-- Ambient Voice Waves (Right) -->
  <path d="M 46 25 C 47.5 27.5 47.5 31.5 46 34" fill="none" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
  <path d="M 51 21 C 53.5 25.5 53.5 33.5 51 38" fill="none" stroke="#bae6fd" stroke-width="2.2" stroke-linecap="round" opacity="0.6" />

  <!-- Central Microphone Capsule -->
  <rect x="27" y="16" width="10" height="17" rx="5" fill="#ffffff" />
  <!-- Capsule Voice Slit -->
  <line x1="32" y1="20" x2="32" y2="25" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />

  <!-- Mic Arc Support -->
  <path d="M 23 27 C 23 35.5 41 35.5 41 27" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

  <!-- Mic Stem & Base Stand -->
  <line x1="32" y1="35.5" x2="32" y2="44" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <line x1="25" y1="44" x2="39" y2="44" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

  <!-- Neural Core Light Dot -->
  <circle cx="32" cy="40" r="1.3" fill="#38bdf8" />
</svg>
